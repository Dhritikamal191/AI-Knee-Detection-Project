project:
  name: "Knee Osteoarthritis Grading"
  version: "1.0.0"
  environment: "production"

model:
  name: "Experiment 5"
  architecture: "Ordinal ResNet50"
  num_classes: 5
  image_size: 224
  repository: "dhriti191/ai-knee-detection-resnet50"
  filename: "best_model_experiment5.pt"

inference:
  confidence_threshold: 0.50
  device: "auto"

classes:
  0: "Grade 0"
  1: "Grade 1"
  2: "Grade 2"
  3: "Grade 3"
  4: "Grade 4"

explainability:
  method: "Grad-CAM"

performance:
  accuracy: 0.6093
  macro_f1: 0.5989
  quadratic_weighted_kappa: 0.7707

application:
  max_upload_size_mb: 10
  supported_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
