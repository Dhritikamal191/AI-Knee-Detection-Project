model:
  name: "Experiment 5"
  architecture: "OrdinalResNet50"

  repository:
    type: "huggingface"
    repo_id: "dhriti191/ai-knee-detection-resnet50"
    filename: "best_model_experiment5.pt"

  input:
    image_size: 224
    channels: 3

  output:
    num_classes: 5
    class_names:
      - "Grade 0"
      - "Grade 1"
      - "Grade 2"
      - "Grade 3"
      - "Grade 4"

  ordinal:
    num_thresholds: 4
    threshold: 0.5

  preprocessing:
    resize:
      width: 224
      height: 224

    normalize:
      mean:
        - 0.485
        - 0.456
        - 0.406

      std:
        - 0.229
        - 0.224
        - 0.225

performance:
  accuracy: 0.6093
  macro_f1: 0.5989
  quadratic_weighted_kappa: 0.7707

explainability:
  method: "Grad-CAM"
