services:

  # ============================================================
  # STREAMLIT APPLICATION
  # ============================================================
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: knee-oa-streamlit

    ports:
      - "8501:8501"

    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501

    restart: unless-stopped


  # ============================================================
  # FASTAPI APPLICATION
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: knee-oa-api

    ports:
      - "8000:8000"

    command:
      - uvicorn
      - api.main:app
      - --host=0.0.0.0
      - --port=8000

    restart: unless-stopped
